
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent browsers from interpreting files as a different MIME type.
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent the application from being embedded in a frame.
    add_header X-Frame-Options "DENY" always;

    # Limit referrer information sent to other origins.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable browser features this application does not need.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Restrict the sources the browser is allowed to load.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
